[workspace]
resolver = "2"
members = ["crates/tv-core", "crates/tv-host", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["TabVault"]
repository = "https://github.com/tabvault/tabvault"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
blake3 = "1"
# NOTE: rusqlite is declared in tv-core, not here, because the SQLCipher feature
# set is security-critical and must not be silently widened by another member.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# `panic = "abort"` is intentionally NOT set: it would break `cargo test --release`.

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
