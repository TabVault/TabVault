[package]
name = "tv-core"
description = "TabVault core: schema, snapshot diffing, retention, browser session-file parsers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tv_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
lz4_flex.workspace = true
blake3.workspace = true
tracing.workspace = true
aes-gcm = "0.10"
base64 = "0.22"

# Encryption at rest. `bundled-sqlcipher-vendored-openssl` statically links the
# SQLCipher amalgamation *and* OpenSSL, so the shipped binary has no libcrypto
# DLL dependency and the end user needs no Perl/OpenSSL toolchain.
rusqlite = { version = "0.43", features = [
    "bundled-sqlcipher-vendored-openssl",
    "functions",
    "chrono",
    "serde_json",
    "backup",
] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
